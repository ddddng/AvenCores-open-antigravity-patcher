name: Manual Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override; leave empty to auto-increment the patch version"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply build version
        id: version
        shell: python
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["BUILD_VERSION"].strip()
          if not version:
              current = Path("source/patcher/constants.py").read_text(encoding="utf-8")
              match = re.search(r'^VERSION\s*=\s*"([^"]+)"', current, re.MULTILINE)
              if not match:
                  raise SystemExit("Could not read the current project version")
              major, minor, patch = map(int, match.group(1).split("."))
              version = f"{major}.{minor}.{patch + int(os.environ['BUILD_NUMBER'])}"
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid version: {version!r}. Expected MAJOR.MINOR.PATCH.")

          constants = Path("source/patcher/constants.py")
          text = constants.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'^VERSION\s*=\s*"[^"]+"',
              f'VERSION = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not locate VERSION in source/patcher/constants.py")
          constants.write_text(updated, encoding="utf-8")

          version_file = Path("source/version.txt")
          text = version_file.read_text(encoding="utf-8")
          for key in ("filevers", "prodvers"):
              text, count = re.subn(
                  rf"({key}=\()\d+,\s*\d+,\s*\d+,\s*\d+(\))",
                  lambda m: f"{m.group(1)}{version.replace('.', ', ')}, 0{m.group(2)}",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update {key} in source/version.txt")
          for key in ("FileVersion", "ProductVersion"):
              text, count = re.subn(
                  rf"(StringStruct\('{key}',\s*')[^']+(')",
                  rf"\g<1>{version}\g<2>",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update {key} in source/version.txt")
          version_file.write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Building version {version}")

      - name: Install dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        if: runner.os == 'Windows'
        working-directory: source
        run: pyinstaller --onefile --uac-admin --icon=icon.ico --name=Open_AG_Patcher_Windows --noupx --clean --version-file=version.txt main.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        working-directory: source
        run: pyinstaller --onefile --icon=icon.ico --name=Open_AG_Patcher_Linux --hidden-import=packaging --hidden-import=packaging.version --hidden-import=packaging.specifiers --hidden-import=packaging.requirements --clean main.py

      - name: Build macOS universal executable
        if: runner.os == 'macOS'
        working-directory: source
        run: pyinstaller --onefile --name=Open_AG_Patcher_macOS --target-arch universal2 --hidden-import=packaging --hidden-import=packaging.version --hidden-import=packaging.specifiers --hidden-import=packaging.requirements --clean main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open_AG_Patcher_${{ matrix.platform }}_v${{ steps.version.outputs.version }}
          path: source/dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: python
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["BUILD_VERSION"].strip()
          if not version:
              current = Path("source/patcher/constants.py").read_text(encoding="utf-8")
              match = re.search(r'^VERSION\s*=\s*"([^"]+)"', current, re.MULTILINE)
              if not match:
                  raise SystemExit("Could not read the current project version")
              major, minor, patch = map(int, match.group(1).split("."))
              version = f"{major}.{minor}.{patch + int(os.environ['BUILD_NUMBER'])}"
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid version: {version!r}. Expected MAJOR.MINOR.PATCH.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")

      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Open AG Patcher v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
